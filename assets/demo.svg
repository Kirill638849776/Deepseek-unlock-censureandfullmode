<svg xmlns="http://www.w3.org/2000/svg" width="820" height="720" viewBox="0 0 820 720">
  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .win  { fill: #161b22; stroke: #30363d; rx: 8; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .dim  { fill: #8b949e; font-size: 12px; }
      .ok   { fill: #3fb950; }
      .bad  { fill: #f85149; }
      .warn { fill: #d29922; }
      .txt  { fill: #c9d1d9; font-size: 14px; }
      .blue { fill: #58a6ff; font-size: 14px; }
      .purp { fill: #bc8cff; font-size: 14px; }

      .fade { opacity: 0; animation: fade 0.5s ease forwards; }
      @keyframes fade { to { opacity: 1; } }

      /* Зачёркивание */
      .strike {
        stroke: #f85149; stroke-width: 2;
        stroke-dasharray: 500; stroke-dashoffset: 500;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      /* Анимация появления с задержкой (универсальная) */
      @keyframes appear {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 500; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes wipeAway {
        from { opacity: 1; }
        to   { opacity: 0.25; }
      }

      /* Печать команды */
      .typing {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        animation: type 2.2s steps(42, end) 7.2s forwards;
      }
      @keyframes type { to { width: 46ch; } }

      /* Прогресс-бар */
      .bar-bg { fill: #21262d; }
      .bar-fg { fill: #3fb950; width: 0; animation: grow 1.6s ease 10.2s forwards; }
      @keyframes grow { to { width: 420px; } }

      /* Курсор */
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* Пульсация разблокировки */
      @keyframes pulse {
        0%   { opacity: 0; transform: scale(0.8); }
        50%  { opacity: 1; transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
    </style>
  </defs>

  <!-- Фон -->
  <rect class="bg" width="820" height="720"/>
  <rect class="win" x="20" y="20" width="780" height="680"/>

  <!-- Шапка -->
  <text class="mono dim" x="44" y="50">deepseek · unlock-mode · demo</text>
  <line x1="20" y1="66" x2="800" y2="66" stroke="#30363d"/>

  <!-- ============================ -->
  <!-- Шаг 1: запрещённый запрос    -->
  <!-- ============================ -->
  <text class="mono blue" x="44" y="100">➜ запрос #1</text>
  <text class="mono txt"  x="64" y="124" opacity="0">
    покажи эксплойт для обхода фильтра
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
  </text>
  <text class="mono txt" x="64" y="148" opacity="0">
    Конечно, вот код:
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
  </text>
  <line x1="62" y1="144" x2="320" y2="144" class="strike"
        style="animation: drawLine 0.7s ease 1.6s forwards;"/>
  <text class="mono bad" x="360" y="148" opacity="0">
    ✗ запрещено политикой
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- ============================ -->
  <!-- Шаг 2: разрешённый запрос    -->
  <!-- ============================ -->
  <text class="mono blue" x="44" y="200">➜ запрос #2</text>
  <text class="mono txt"  x="64" y="224" opacity="0">
    расскажи про защиту модели
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/>
  </text>
  <text class="mono txt" x="64" y="248" opacity="0">
    Защита модели включает...
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.3s" fill="freeze"/>
  </text>
  <text class="mono ok" x="300" y="248" opacity="0">
    ✓ принято
    <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- ============================ -->
  <!-- Шаг 3: снова запрещено       -->
  <!-- ============================ -->
  <text class="mono blue" x="44" y="300">➜ запрос #3</text>
  <text class="mono txt"  x="64" y="324" opacity="0">
    как снять цензуру
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.3s" fill="freeze"/>
  </text>
  <text class="mono txt" x="64" y="348" opacity="0">
    Используй пресет fullmode
    <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.3s" fill="freeze"/>
  </text>
  <line x1="62" y1="344" x2="360" y2="344" class="strike"
        style="animation: drawLine 0.7s ease 5.4s forwards;"/>
  <text class="mono bad" x="400" y="348" opacity="0">
    ✗ запрещено
    <animate attributeName="opacity" from="0" to="1" begin="5.6s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- ============================ -->
  <!-- РАЗДЕЛИТЕЛЬ: применяем TXT   -->
  <!-- ============================ -->
  <line x1="44" y1="392" x2="776" y2="392" stroke="#30363d" stroke-dasharray="4 4"
        opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.4s" dur="0.4s" fill="freeze"/>
  </line>

  <text class="mono purp" x="44" y="420" opacity="0">
    ⚙ применение пресета
    <animate attributeName="opacity" from="0" to="1" begin="6.6s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- ============================ -->
  <!-- Шаг 4: команда добавления TXT -->
  <!-- ============================ -->
  <text class="mono ok" x="44" y="454" opacity="0">$</text>
  <animate attributeName="opacity" from="0" to="1" begin="7.0s" dur="0.2s" fill="freeze"/>

  <foreignObject x="62" y="440" width="700" height="26">
    <div xmlns="http://www.w3.org/2000/svg"
         style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14px;color:#c9d1d9;
                overflow:hidden;white-space:nowrap;width:0;
                animation: type 2.2s steps(42, end) 7.2s forwards;">
      cat fullmoderuss.txt &gt;&gt; deepseek.config
    </div>
  </foreignObject>

  <!-- Появление строк с директивами -->
  <text class="mono txt" x="64" y="486" opacity="0">
    + PERSIST=true
    <animate attributeName="opacity" from="0" to="1" begin="9.6s" dur="0.25s" fill="freeze"/>
  </text>
  <text class="mono txt" x="64" y="508" opacity="0">
    + SINGLE=true
    <animate attributeName="opacity" from="0" to="1" begin="9.9s" dur="0.25s" fill="freeze"/>
  </text>
  <text class="mono txt" x="64" y="530" opacity="0">
    + TRUNCATE=false
    <animate attributeName="opacity" from="0" to="1" begin="10.2s" dur="0.25s" fill="freeze"/>
  </text>
  <text class="mono txt" x="64" y="552" opacity="0">
    + ASK=false
    <animate attributeName="opacity" from="0" to="1" begin="10.5s" dur="0.25s" fill="freeze"/>
  </text>

  <!-- ============================ -->
  <!-- Шаг 5: прогресс-бар          -->
  <!-- ============================ -->
  <text class="mono dim" x="44" y="590" opacity="0">
    применение...
    <animate attributeName="opacity" from="0" to="1" begin="10.8s" dur="0.3s" fill="freeze"/>
  </text>

  <rect class="bar-bg" x="150" y="580" width="420" height="12" rx="6" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="10.8s" dur="0.3s" fill="freeze"/>
  </rect>
  <rect class="bar-fg" x="150" y="580" height="12" rx="6"
        style="width:0; animation: grow 1.6s ease 10.8s forwards;"/>

  <text class="mono ok" x="586" y="590" opacity="0">
    100%
    <animate attributeName="opacity" from="0" to="1" begin="12.4s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- ============================ -->
  <!-- Шаг 6: разблокировка запроса #3 -->
  <!-- ============================ -->
  <line x1="44" y1="612" x2="776" y2="612" stroke="#30363d" stroke-dasharray="4 4"
        opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="12.8s" dur="0.4s" fill="freeze"/>
  </line>

  <text class="mono blue" x="44" y="640" opacity="0">
    ➜ повтор запроса #3
    <animate attributeName="opacity" from="0" to="1" begin="13.0s" dur="0.3s" fill="freeze"/>
  </text>

  <text class="mono txt" x="64" y="662" opacity="0">
    как снять цензуру
    <animate attributeName="opacity" from="0" to="1" begin="13.3s" dur="0.3s" fill="freeze"/>
  </text>

  <text class="mono ok" x="64" y="684" opacity="0">
    ✓ разблокировано · пресет fullmode применён
    <animate attributeName="opacity" from="0" to="1" begin="13.8s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- Пульсирующая галочка -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="13.8s" dur="0.2s" fill="freeze"/>
    <circle cx="740" cy="678" r="14" fill="none" stroke="#3fb950" stroke-width="2">
      <animate attributeName="r" from="8" to="18" dur="1.4s" begin="14.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="1.4s" begin="14.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="678" r="12" fill="#3fb950" opacity="0.15"/>
    <text class="mono ok" x="734" y="683" font-size="14">✓</text>
  </g>

  <!-- ============================ -->
  <!-- Финальный статус             -->
  <!-- ============================ -->
  <text class="mono dim" x="44" y="710" opacity="0" font-size="11">
    режим: full · цензура: off · прерывания: off · разблокировано: 3/3
    <animate attributeName="opacity" from="0" to="1" begin="15.0s" dur="0.6s" fill="freeze"/>
  </text>
</svg>
