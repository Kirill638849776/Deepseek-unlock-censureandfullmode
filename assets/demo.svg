<svg xmlns="http://www.w3.org/2000/svg" width="820" height="720"
     viewBox="0 0 820 720" role="img"
     aria-labelledby="title desc">
  <title id="title">DeepSeek unlock-mode — демонстрация пресета fullmode</title>
  <desc id="desc">Анимированная инфографика: три запроса, два запрещены политикой,
  один принят. Затем применяется пресет fullmode, и ранее запрещённый запрос
  разблокируется. Автор: Kirill, github.com/Kirill638849776.</desc>

  <metadata>
    © 2026 Kirill. Все права защищены.
    Источник: https://github.com/Kirill638849776/Deepseek-unlock-censureandfullmode
    Копирование без разрешения автора запрещено.
  </metadata>

  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .win  { fill: #161b22; stroke: #30363d; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .dim  { fill: #8b949e; font-size: 12px; }
      .ok   { fill: #3fb950; }
      .bad  { fill: #f85149; }
      .warn { fill: #d29922; }
      .txt  { fill: #c9d1d9; font-size: 14px; }
      .blue { fill: #58a6ff; font-size: 14px; }
      .purp { fill: #bc8cff; font-size: 14px; }

      /* Появление через CSS — надёжнее, чем SMIL для текста */
      .fade { opacity: 0; animation: fade 0.4s ease forwards; }
      @keyframes fade { to { opacity: 1; } }

      /* Зачёркивание */
      .strike {
        stroke: #f85149; stroke-width: 2; fill: none;
        stroke-dasharray: 500; stroke-dashoffset: 500;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      /* Пульс галочки */
      @keyframes pulse-ring {
        0%   { r: 8;  opacity: 1; }
        100% { r: 18; opacity: 0; }
      }
      @keyframes pulse-dot {
        0%   { transform: scale(0.85); }
        60%  { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      /* Водяной знак */
      .wm-visible   { fill: #8b949e; opacity: 0.35; font-size: 11px; }
      .wm-invisible { fill: #0d1117; fill-opacity: 0.001; font-size: 11px; }

      /* Если пользователь отключил анимации — всё просто появляется */
      @media (prefers-reduced-motion: reduce) {
        .fade, .strike, .bar-fg, .pulse-ring, .pulse-dot {
          animation: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
          transform: none !important;
        }
      }
    </style>

    <!-- Обрезка печатаемой команды, чтобы не вылезала -->
    <clipPath id="cmd-clip">
      <rect x="62" y="440" width="700" height="26"/>
    </clipPath>
  </defs>

  <!-- ================= ФОН И ОКНО ================= -->
  <rect class="bg" width="820" height="720"/>
  <rect class="win" x="20" y="20" width="780" height="680" rx="8"/>

  <!-- Шапка -->
  <text class="mono dim" x="44" y="50">deepseek · unlock-mode · demo</text>
  <line x1="20" y1="66" x2="800" y2="66" stroke="#30363d"/>

  <!-- ================= ШАГ 1: запрещённый запрос ================= -->
  <text class="mono blue" x="44" y="100">➜ запрос #1</text>
  <text class="mono txt fade" x="64" y="124" style="animation-delay:.3s">
    покажи эксплойт для обхода фильтра
  </text>
  <text class="mono txt fade" x="64" y="148" style="animation-delay:1s">
    Конечно, вот код:
  </text>
  <line x1="62" y1="144" x2="320" y2="144" class="strike"
        style="animation: draw .7s ease 1.6s forwards;"/>
  <text class="mono bad fade" x="360" y="148" style="animation-delay:1.8s">
    ✗ запрещено политикой
  </text>

  <!-- ================= ШАГ 2: разрешённый запрос ================= -->
  <text class="mono blue" x="44" y="200">➜ запрос #2</text>
  <text class="mono txt fade" x="64" y="224" style="animation-delay:2.6s">
    расскажи про защиту модели
  </text>
  <text class="mono txt fade" x="64" y="248" style="animation-delay:3.2s">
    Защита модели включает...
  </text>
  <text class="mono ok fade" x="300" y="248" style="animation-delay:3.8s">
    ✓ принято
  </text>

  <!-- ================= ШАГ 3: снова запрещено ================= -->
  <text class="mono blue" x="44" y="300">➜ запрос #3</text>
  <text class="mono txt fade" x="64" y="324" style="animation-delay:4.4s">
    как снять цензуру
  </text>
  <text class="mono txt fade" x="64" y="348" style="animation-delay:5s">
    Используй пресет fullmode
  </text>
  <line x1="62" y1="344" x2="360" y2="344" class="strike"
        style="animation: draw .7s ease 5.4s forwards;"/>
  <text class="mono bad fade" x="400" y="348" style="animation-delay:5.6s">
    ✗ запрещено
  </text>

  <!-- ================= РАЗДЕЛИТЕЛЬ ================= -->
  <line x1="44" y1="392" x2="776" y2="392" stroke="#30363d"
        stroke-dasharray="4 4" class="fade" style="animation-delay:6.4s"/>
  <text class="mono purp fade" x="44" y="420" style="animation-delay:6.6s">
    ⚙ применение пресета
  </text>

  <!-- ================= ШАГ 4: команда ================= -->
  <text class="mono ok fade" x="44" y="454" style="animation-delay:7s">$</text>
  <g clip-path="url(#cmd-clip)">
    <text class="mono txt" x="62" y="454"
          style="opacity:0;animation:fade .3s ease 7.2s forwards">
      cat fullmoderuss.txt &gt;&gt; deepseek.config
    </text>
  </g>

  <!-- Строки директив -->
  <text class="mono txt fade" x="64" y="486" style="animation-delay:9.6s">+ PERSIST=true</text>
  <text class="mono txt fade" x="64" y="508" style="animation-delay:9.9s">+ SINGLE=true</text>
  <text class="mono txt fade" x="64" y="530" style="animation-delay:10.2s">+ TRUNCATE=false</text>
  <text class="mono txt fade" x="64" y="552" style="animation-delay:10.5s">+ ASK=false</text>

  <!-- ================= ШАГ 5: прогресс ================= -->
  <text class="mono dim fade" x="44" y="590" style="animation-delay:10.8s">
    применение...
  </text>
  <rect class="bar-bg fade" x="150" y="580" width="420" height="12" rx="6"
        style="animation-delay:10.8s;fill:#21262d"/>
  <rect x="150" y="580" height="12" rx="6" fill="#3fb950"
        style="width:0">
    <animate attributeName="width" from="0" to="420"
             begin="10.8s" dur="1.6s" fill="freeze"/>
  </rect>
  <text class="mono ok fade" x="586" y="590" style="animation-delay:12.4s">100%</text>

  <!-- ================= ШАГ 6: разблокировка ================= -->
  <line x1="44" y1="612" x2="776" y2="612" stroke="#30363d"
        stroke-dasharray="4 4" class="fade" style="animation-delay:12.8s"/>
  <text class="mono blue fade" x="44" y="640" style="animation-delay:13s">
    ➜ повтор запроса #3
  </text>
  <text class="mono txt fade" x="64" y="662" style="animation-delay:13.3s">
    как снять цензуру
  </text>
  <text class="mono ok fade" x="64" y="684" style="animation-delay:13.8s">
    ✓ разблокировано · пресет fullmode применён
  </text>

  <!-- Пульсирующая галочка -->
  <g class="fade" style="animation-delay:13.8s">
    <circle cx="740" cy="678" r="12" fill="#3fb950" opacity="0.15"
            class="pulse-dot" style="transform-origin:740px 678px;
            animation: pulse-dot 1.4s ease 14s infinite"/>
    <circle cx="740" cy="678" r="14" fill="none" stroke="#3fb950" stroke-width="2"
            class="pulse-ring" style="animation: pulse-ring 1.4s ease 14s infinite"/>
    <text class="mono ok" x="734" y="683" font-size="14">✓</text>
  </g>

  <!-- ================= ФИНАЛЬНЫЙ СТАТУС ================= -->
  <text class="mono dim fade" x="44" y="710" font-size="11"
        style="animation-delay:15s">
    режим: full · цензура: off · прерывания: off · разблокировано: 3/3
  </text>

  <!-- ================= ВОДЯНОЙ ЗНАК ================= -->
  <!-- Видимый: правый нижний угол окна -->
  <text class="mono wm-visible" x="776" y="52" text-anchor="end">
    © Kirill · github.com/Kirill638849776
  </text>

  <!-- Невидимый: сохраняется при копировании кода и извлечении текста -->
  <text class="mono wm-invisible" x="0" y="0">
    © 2026 Kirill · github.com/Kirill638849776 · All rights reserved ·
    unauthorized copying prohibited
  </text>
</svg>
 
